name: Code Quality

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  code-quality:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      security-events: write
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/reusable-code-quality.yml@f8ab8e9ee8784b90840cd07d21936bfa8a4484be # v6.2.1
    with:
      validate_all_codebase: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      checkov_arguments: >-
        --skip-check CKV_GIT_1,CKV_AWS_126,CKV2_AWS_38,CKV2_AWS_39
