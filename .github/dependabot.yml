---
# This file is auto-generated, do not manually amend.
# scripts/generate-dependabot-file.sh

version: 2

updates:
  # Dependency management strategy:
  # ministryofjustice/modernisation-platform#8211
  #
  # Major and minor/patch version updates are grouped separately, with both
  # checked monthly to reduce routine Dependabot PR noise.
  #
  # Monthly is a compromise, not the ticket's proposed fortnightly major
  # and six-monthly minor/patch cadence.
  #
  # Dependabot alerts and security updates must be enabled separately in
  # repository/org settings; security updates do not wait for this schedule.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      action-major:
        update-types:
          - "major"
      action-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/modules/access-analyzer"
      - "/modules/backup"
      - "/modules/cloudtrail"
      - "/modules/config"
      - "/modules/ebs"
      - "/modules/guardduty"
      - "/modules/iam"
      - "/modules/iam-credential-response"
      - "/modules/imdsv2"
      - "/modules/securityhub"
      - "/modules/securityhub-alarms"
      - "/modules/ssm"
      - "/modules/support"
      - "/test/backup-test"
      - "/test/cloudtrail-test"
      - "/test/iam-credential-response-test"
      - "/test/securityhub-alarms-test"
      - "/test/securityhub-test"
      - "/test/support-test"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      terraform-major:
        update-types:
          - "major"
      terraform-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directories:
      - "/test"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      gomod-major:
        update-types:
          - "major"
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"
